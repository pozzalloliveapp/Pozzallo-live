<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millesimo - Locale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        #eventBox {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .event-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .event-empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .event-content {
            animation: slideIn 0.3s ease;
        }
        
        .event-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .event-title::before {
            content: '📅';
            font-size: 28px;
        }
        
        .event-desc {
            color: #555;
            line-height: 1.6;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .event-timestamp {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍕 Millesimo</h1>
            <p class="subtitle">Scopri gli eventi del nostro locale</p>
        </header>

        <div id="eventBox" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #667eea;">Caricamento evento...</p>
        </div>

        <footer>
            <p>Powered by Pozzallo Live App © 2026</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDqVl3-5vB0_-K6X8mL9nOpQrStZ5zF_Jg",
            authDomain: "pozzallolive-app.firebaseapp.com",
            projectId: "pozzallolive-app",
            storageBucket: "pozzallolive-app.appspot.com",
            messagingSenderId: "825971923234",
            appId: "1:825971923234:web:1a5f6c6a3f7e9c2d1f3a5b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Elemento DOM
        const eventBox = document.getElementById('eventBox');
        const localeName = 'millesimo'; // Nome fisso per questo locale

        // Leggi l'evento da Firestore
        async function loadEvent() {
            try {
                const docRef = doc(db, 'locali', localeName);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    displayEvent(data);
                } else {
                    displayNoEvent();
                }
            } catch (error) {
                console.error('Errore Firebase:', error);
                eventBox.innerHTML = `
                    <div class="event-empty">
                        <div class="event-empty-icon">⚠️</div>
                        <p>Errore nel caricamento dell'evento</p>
                        <p style="font-size: 12px; margin-top: 10px; color: #ccc;">${error.message}</p>
                    </div>
                `;
            }
        }

        // Mostra l'evento
        function displayEvent(data) {
            const title = escapeHtml(data.eventTitle || 'Evento');
            const desc = escapeHtml(data.eventDesc || 'Nessuna descrizione');
            const timestamp = data.savedAt ? formatDate(data.savedAt) : '';

            let html = `
                <div class="event-content">
                    <div class="event-title">${title}</div>
                    <div class="event-desc">${desc}</div>
            `;

            if (timestamp) {
                html += `<div class="event-timestamp">📌 Aggiornato: ${timestamp}</div>`;
            }

            html += '</div>';
            eventBox.innerHTML = html;
        }

        // Mostra nessun evento
        function displayNoEvent() {
            eventBox.innerHTML = `
                <div class="event-empty">
                    <div class="event-empty-icon">📭</div>
                    <p><strong>Nessun evento</strong></p>
                    <p style="font-size: 14px; margin-top: 10px; color: #999;">Al momento non ci sono eventi programmati</p>
                </div>
            `;
        }

        // Formatta la data
        function formatDate(isoString) {
            try {
                const date = new Date(isoString);
                return date.toLocaleString('it-IT', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return '';
            }
        }

        // Escape HTML per sicurezza
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Carica l'evento al caricamento della pagina
        loadEvent();
    </script>
</body>
</html>
