<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pozzallo Live - Profilo</title>

  <link rel="icon" type="image/png" href="Logo_1.png" />
  <meta name="theme-color" content="#050816" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050816;
      color: white;
    }

    .page {
      max-width: 500px;
      margin: auto;
      padding: 30px 20px 120px;
    }

    .title {
      font-size: 40px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .title span {
      color: #7c3aed;
    }

    .subtitle {
      font-size: 15px;
      opacity: 0.9;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .profile-box {
      text-align: center;
      line-height: 1.8;
      font-size: 16px;
    }

    .avatar {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 14px;
      background: rgba(124,58,237,0.18);
      border: 1px solid rgba(124,58,237,0.35);
      font-weight: bold;
      font-size: 14px;
    }

    .stats {
      margin-top: 18px;
      text-align: left;
      background: rgba(255,255,255,0.04);
      padding: 16px;
      border-radius: 16px;
      line-height: 1.8;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(5,8,22,0.96);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      padding: 18px 0;
    }

    .bottom-nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.85;
    }

    .bottom-nav a.active {
      color: #7c3aed;
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="page">

  <div class="title">
    PROFILO <span>LIVE.</span>
  </div>

  <div class="subtitle">
    Accedi, personalizza il tuo profilo e fatti conoscere nella community.
  </div>

  <div class="card" id="authBox">

    <input
      type="text"
      id="username"
      placeholder="Username"
    />

    <input
      type="email"
      id="email"
      placeholder="Email"
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
    />

    <button class="btn" onclick="registerUser()">
      Registrati
    </button>

    <button class="btn" onclick="loginUser()">
      Accedi
    </button>

  </div>

  <div
    class="card"
    id="profileBox"
    style="display:none;"
  >

    <div class="profile-box">

      <div class="avatar" id="avatarBox">
        👤
      </div>

      <div>
        <strong id="profileUsername">
          Username
        </strong>
      </div>

      <div id="profileEmail">
        email@email.com
      </div>

      <div class="badge" id="profileBadge">
        👑 VIP MEMBER
      </div>

      <div class="stats">
        <div><strong>Bio:</strong> <span id="profileBio">Nessuna bio</span></div>
        <div><strong>Livello:</strong> <span id="profileLevel">Lv.1</span></div>
        <div><strong>Commenti:</strong> <span id="profileComments">0</span></div>
        <div><strong>Presenze locali:</strong> <span id="profilePresence">0</span></div>
      </div>

      <br>

      <textarea
        id="bioInput"
        placeholder="Scrivi la tua bio..."
      ></textarea>

      <button class="btn" onclick="saveBio()">
        Salva Bio
      </button>

      <button class="btn" onclick="logoutUser()">
        Esci
      </button>

    </div>

  </div>

</div>

<div class="bottom-nav">
  <a href="index.html">Home</a>
  <a href="locali.html">Locali</a>
  <a href="community.html">Community</a>
  <a href="eventi.html">Eventi</a>
  <a href="profilo.html" class="active">Profilo</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCchq77rBl42Ra4yCzMt_g_TjbHNrOqYyE",
  authDomain: "pozzallolive2026.firebaseapp.com",
  projectId: "pozzallolive2026",
  storageBucket: "pozzallolive2026.firebasestorage.app",
  messagingSenderId: "435479334572",
  appId: "1:435479334572:web:2fa12cc37bfab0af3ad909",
  measurementId: "G-3EZX810ZSH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.registerUser = async function () {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!username) {
    alert("Inserisci uno username");
    return;
  }

  if (!email || !password) {
    alert("Compila tutti i campi");
    return;
  }

  try {const userCredential = await createUserWithEmailAndPassword(auth, email, password);

localStorage.setItem("pl_username", username);
localStorage.setItem("pl_email", email);
localStorage.setItem("pl_uid", userCredential.user.uid);

alert("Registrazione completata ✅");

  } catch (error) {
    alert(error.message);
  }
};

window.loginUser = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);

localStorage.setItem("pl_email", email);
localStorage.setItem("pl_uid", userCredential.user.uid);

alert("Accesso effettuato ✅");

  } catch (error) {
    alert(error.message);
  }
};

window.logoutUser = async function () {
  await signOut(auth);
};

window.saveBio = function () {
  const bio = document.getElementById("bioInput").value.trim();

  localStorage.setItem("pl_bio", bio);

  document.getElementById("profileBio").innerText =
    bio || "Nessuna bio";

  alert("Bio salvata ✅");
};

onAuthStateChanged(auth, (user) => {
  const authBox = document.getElementById("authBox");
  const profileBox = document.getElementById("profileBox");

  if (user) {
    authBox.style.display = "none";
    profileBox.style.display = "block";

    const username =
      localStorage.getItem("pl_username") || "Utente Live";

    const bio =
      localStorage.getItem("pl_bio") || "Nessuna bio";

    const comments =
      localStorage.getItem("pl_comments") || "0";

    const presence =
      localStorage.getItem("pl_presence") || "0";

    let level = "Lv.1";

    if (parseInt(comments) >= 10) {
      level = "Lv.2";
    }

    if (parseInt(comments) >= 25) {
      level = "Lv.3";
    }

    document.getElementById("profileUsername").innerText = username;
    document.getElementById("profileEmail").innerText = user.email;
    document.getElementById("profileBio").innerText = bio;
    document.getElementById("profileLevel").innerText = level;
    document.getElementById("profileComments").innerText = comments;
    document.getElementById("profilePresence").innerText = presence;

    if (username.toLowerCase().includes("vip")) {
      document.getElementById("profileBadge").innerHTML =
        "👑 VIP MEMBER";
    } else {
      document.getElementById("profileBadge").innerHTML =
        "🔥 COMMUNITY MEMBER";
    }
  } else {
    authBox.style.display = "block";
    profileBox.style.display = "none";
  }
});
</script>

</body>
</html>
