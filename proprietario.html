<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proprietario - Pozzallo Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f9fafb;
            --border-radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            color: white;
        }

        .header-title h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 12px 14px;
            background: var(--light);
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            color: #6b7280;
            font-weight: 500;
            font-size: 14px;
        }

        .file-input-label:hover {
            background: #f0f4ff;
            border-color: var(--primary);
            color: var(--primary);
        }

        .file-name {
            font-size: 12px;
            color: var(--success);
            margin-top: 8px;
            font-weight: 600;
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-save:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border-left: 4px solid #dc2626;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-left: 4px solid #059669;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .events-list, .photos-list {
            margin-top: 20px;
        }

        .event-item, .photo-item {
            background: var(--light);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 15px;
        }

        .event-item strong {
            color: var(--dark);
            display: block;
            margin-bottom: 5px;
        }

        .event-item small {
            color: #6b7280;
            display: block;
        }

        .photo-item {
            align-items: center;
        }

        .photo-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-delete:hover {
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>🎪 Area Proprietario</h1>
                <p id="localeInfo">Locale: -</p>
            </div>
            <div class="header-actions">
                <a href="locale.html" id="viewLink" class="btn btn-primary">👁️ Visualizza</a>
                <button id="logoutBtn" class="btn btn-secondary">🚪 Logout</button>
            </div>
        </header>

        <div id="errorAlert" class="alert alert-error"></div>
        <div id="successAlert" class="alert alert-success"></div>

        <div class="content">
            <!-- AGGIUNGI EVENTO -->
            <div class="card">
                <h2>📅 Aggiungi Evento</h2>
                
                <form id="eventForm">
                    <div class="form-group">
                        <label for="eventTitle">Titolo Evento</label>
                        <input type="text" id="eventTitle" placeholder="Es: Serata Latino Americano" required>
                    </div>

                    <div class="form-group">
                        <label for="eventDesc">Descrizione</label>
                        <textarea id="eventDesc" placeholder="Descrivi l'evento..." required></textarea>
                    </div>

                    <button type="submit" class="btn-save">💾 Aggiungi Evento</button>
                </form>

                <div class="events-list">
                    <h3 style="font-size: 14px; color: var(--dark); margin-bottom: 12px;">📋 Eventi Attuali</h3>
                    <div id="eventsList" class="empty-state">Caricamento...</div>
                </div>
            </div>

            <!-- CARICA FOTO -->
            <div class="card">
                <h2>📸 Carica Foto</h2>
                
                <form id="photoForm">
                    <div class="form-group">
                        <label>Seleziona Foto</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="photoFile" accept="image/*" required>
                            <label for="photoFile" class="file-input-label">
                                📁 Clicca per selezionare una foto
                            </label>
                            <div id="fileName" class="file-name"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-save">🚀 Carica Foto</button>
                </form>

                <div class="photos-list">
                    <h3 style="font-size: 14px; color: var(--dark); margin-bottom: 12px;">🖼️ Foto Caricate</h3>
                    <div id="photosList" class="empty-state">Caricamento...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth, storage } from "./firebase.js";
        import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { doc, getDoc, updateDoc, arrayUnion, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const params = new URLSearchParams(window.location.search);
        const localeId = params.get("locale");

        if (!localeId) {
            alert('Parametro locale mancante');
            window.location.href = 'login.html';
        }

        // Elements
        const localeInfo = document.getElementById('localeInfo');
        const viewLink = document.getElementById('viewLink');
        const logoutBtn = document.getElementById('logoutBtn');
        const eventForm = document.getElementById('eventForm');
        const photoForm = document.getElementById('photoForm');
        const photoFile = document.getElementById('photoFile');
        const fileName = document.getElementById('fileName');
        const eventsList = document.getElementById('eventsList');
        const photosList = document.getElementById('photosList');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        // Firestore reference
        const localeRef = doc(db, 'locali', localeId);

        // Check auth
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        // Update links
        localeInfo.textContent = `Locale: ${localeId.toUpperCase()}`;
        viewLink.href = `locale.html?locale=${localeId}`;

        // Logout
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        // Add event
        eventForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('eventTitle').value.trim();
            const desc = document.getElementById('eventDesc').value.trim();
            const btn = eventForm.querySelector('.btn-save');

            if (!title || !desc) {
                showError('Compila tutti i campi');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Salvataggio...';

            try {
                await updateDoc(localeRef, {
                    eventi: arrayUnion({
                        title: title,
                        desc: desc,
                        createdAt: Timestamp.now()
                    })
                });
                showSuccess('✅ Evento aggiunto!');
                eventForm.reset();
                loadEvents();
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '💾 Aggiungi Evento';
            }
        });

        // Photo file name
        photoFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = `✅ ${file.name}`;
            }
        });

        // Upload photo
        photoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = photoFile.files[0];
            if (!file) {
                showError('Seleziona una foto');
                return;
            }

            const btn = photoForm.querySelector('.btn-save');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Upload...';

            try {
                const timestamp = Date.now();
                const storageRef = ref(storage, `locali/${localeId}/${timestamp}_${file.name}`);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);

                await updateDoc(localeRef, {
                    foto: arrayUnion({
                        url: url,
                        createdAt: Timestamp.now()
                    })
                });

                showSuccess('✅ Foto caricata!');
                photoForm.reset();
                fileName.textContent = '';
                loadPhotos();
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Carica Foto';
            }
        });

        // Load events
        async function loadEvents() {
            try {
                const snap = await getDoc(localeRef);
                if (!snap.exists() || !snap.data().eventi || snap.data().eventi.length === 0) {
                    eventsList.innerHTML = '<div class="empty-state">Nessun evento</div>';
                    return;
                }
                const eventi = snap.data().eventi;
                eventsList.innerHTML = eventi.map((e, i) => `
                    <div class="event-item">
                        <div>
                            <strong>${escapeHtml(e.title)}</strong>
                            <small>${escapeHtml(e.desc)}</small>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                eventsList.innerHTML = '<div class="empty-state">Errore nel caricamento</div>';
            }
        }

        // Load photos
        async function loadPhotos() {
            try {
                const snap = await getDoc(localeRef);
                if (!snap.exists() || !snap.data().foto || snap.data().foto.length === 0) {
                    photosList.innerHTML = '<div class="empty-state">Nessuna foto</div>';
                    return;
                }
                const foto = snap.data().foto;
                photosList.innerHTML = foto.map(f => `
                    <div class="photo-item">
                        <img src="${f.url}" alt="Foto">
                        <div style="flex: 1; margin-left: 10px;">
                            <small style="color: #6b7280; display: block;">📷 Foto caricata</small>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                photosList.innerHTML = '<div class="empty-state">Errore nel caricamento</div>';
            }
        }

        function showError(msg) {
            errorAlert.textContent = '❌ ' + msg;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
            setTimeout(() => errorAlert.classList.remove('show'), 5000);
        }

        function showSuccess(msg) {
            successAlert.textContent = msg;
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
            setTimeout(() => successAlert.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load initial data
        loadEvents();
        loadPhotos();

        // Refresh every 3 seconds
        setInterval(() => {
            loadEvents();
            loadPhotos();
        }, 3000);
    </script>
</body>
</html>
