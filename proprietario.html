<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Proprietario - Pozzallo Live</title>

<style>
body {
  background:#050816;
  color:white;
  font-family:Arial;
}

.page {
  max-width:500px;
  margin:auto;
  padding:30px 20px;
}

.title {
  font-size:32px;
  font-weight:900;
  margin-bottom:20px;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
}

input, textarea {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:10px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:linear-gradient(90deg,#7c3aed,#3b82f6);
  color:white;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="page">

<a href="javascript:history.back()" style="
display:inline-block;
margin-bottom:20px;
color:white;
text-decoration:none;
font-weight:700;
">
← Indietro
</a>

<div class="title">
document.querySelector(".title").innerHTML =
"🛡️ Area Proprietario - " + localeId;
</div>

<div class="card">
<input placeholder="Nome locale">
<textarea placeholder="Descrizione evento di oggi"></textarea>
<button onclick="saveEvent()">Salva Evento</button>
</div>

<div class="card">
<input placeholder="Link immagine">
<button>Aggiungi Foto</button>
</div>

<div class="card">
<button>Pubblica Notifica Locale 📢</button>
</div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCchq77rBl42Ra4yCzMt_g_TjbHNrOqYyE",
  authDomain: "pozzallolive2026.firebaseapp.com",
  projectId: "pozzallolive2026",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const params = new URLSearchParams(window.location.search);
const localeId = params.get("locale");

console.log("Locale corrente:", localeId);
  

window.saveEvent = async function() {
  const title = document.querySelectorAll("input")[0].value;
  const desc = document.querySelectorAll("textarea")[0].value;

  await setDoc(doc(db, "locali", localeId), {
    eventTitle: title,
    eventDesc: desc
  });

  alert("Evento aggiornato 🔥");
};
</script>
  
</body>
</html>
