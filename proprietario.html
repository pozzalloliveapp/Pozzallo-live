<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proprietario - Gestisci Evento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .locale-info {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .locale-name {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .locale-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .button-text {
            display: inline-block;
            transition: opacity 0.3s;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .error-locale {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }
        
        .error-locale-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎪 Gestisci Evento</h1>

        <div id="successMessage" class="success">
            ✅ <strong>Evento salvato!</strong> I clienti potranno vederlo subito.
        </div>

        <div id="errorMessage" class="error"></div>

        <div id="localeError" style="display: none;">
            <div class="error-locale">
                <div class="error-locale-icon">⚠️</div>
                <p><strong>Errore</strong></p>
                <p style="font-size: 14px; margin-top: 10px;">Parametro URL "locale" non trovato</p>
                <p style="font-size: 12px; margin-top: 10px; color: #999;">Accedi come: <code>proprietario.html?locale=millesimo</code></p>
            </div>
        </div>

        <form id="eventForm" style="display: none;">
            <div class="locale-info">
                <div class="locale-label">📍 Locale</div>
                <div class="locale-name" id="localeDisplay"></div>
            </div>

            <div class="form-group">
                <label for="eventTitle">Titolo Evento</label>
                <input type="text" id="eventTitle" placeholder="Es: Serata Latino Americano" required>
            </div>

            <div class="form-group">
                <label for="eventDesc">Descrizione Evento</label>
                <textarea id="eventDesc" placeholder="Es: Musica dal vivo, drink speciali, dj alle 22:00..." required></textarea>
            </div>

            <button type="submit" id="saveBtn">
                <span class="button-text">💾 Salva Evento</span>
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDqVl3-5vB0_-K6X8mL9nOpQrStZ5zF_Jg",
            authDomain: "pozzallolive-app.firebaseapp.com",
            projectId: "pozzallolive-app",
            storageBucket: "pozzallolive-app.appspot.com",
            messagingSenderId: "825971923234",
            appId: "1:825971923234:web:1a5f6c6a3f7e9c2d1f3a5b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Elementi DOM
        const eventForm = document.getElementById('eventForm');
        const localeError = document.getElementById('localeError');
        const localeDisplay = document.getElementById('localeDisplay');
        const eventTitleInput = document.getElementById('eventTitle');
        const eventDescInput = document.getElementById('eventDesc');
        const saveBtn = document.getElementById('saveBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        // Leggi il parametro URL
        const params = new URLSearchParams(window.location.search);
        const localeId = params.get('locale');

        if (!localeId) {
            // Mostra errore se manca il parametro
            localeError.style.display = 'block';
        } else {
            // Mostra il form con il nome del locale
            eventForm.style.display = 'block';
            localeDisplay.textContent = localeId.toUpperCase();

            // Salva l'evento
            eventForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const eventTitle = eventTitleInput.value.trim();
                const eventDesc = eventDescInput.value.trim();

                if (!eventTitle || !eventDesc) {
                    showError('Compila tutti i campi');
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner"></span><span class="button-text">Salvataggio...</span>';

                try {
                    const docRef = doc(db, 'locali', localeId);
                    await setDoc(docRef, {
                        eventTitle: eventTitle,
                        eventDesc: eventDesc,
                        savedAt: new Date().toISOString(),
                        savedBy: 'proprietario'
                    });

                    // Mostra successo
                    showSuccess();
                    eventForm.reset();

                    // Nascondi dopo 3 secondi
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 3000);

                } catch (error) {
                    console.error('Errore Firebase:', error);
                    showError('Errore nel salvataggio: ' + error.message);
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<span class="button-text">💾 Salva Evento</span>';
                }
            });
        }

        // Mostra successo
        function showSuccess() {
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        // Mostra errore
        function showError(msg) {
            errorMessage.textContent = '❌ ' + msg;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }
    </script>
</body>
</html>
